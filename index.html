<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مینی‌اپ زامبی‌کُش حرفه‌ای</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 5px;
            overflow: hidden;
            touch-action: none;
        }
        h2 {
            margin: 5px 0;
            font-size: 16px;
            color: #ff4757;
            text-shadow: 0 0 5px rgba(255, 71, 87, 0.5);
        }
        canvas {
            background-color: #181818;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 380px;
            height: auto;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .control-btn {
            background-color: #2f3542;
            color: white;
            border: 1px solid #57606f;
            padding: 12px 0;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-btn:active {
            background-color: #ff4757;
            transform: translateY(2px);
        }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

    <h2>🔥 زامبی‌کُش تلگرام 🔥</h2>
    <canvas id="gameCanvas" width="380" height="380"></canvas>
    
    <div class="controls">
        <div class="empty"></div>
        <button class="control-btn" id="upBtn">⬆️</button>
        <div class="empty"></div>
        <button class="control-btn" id="leftBtn">⬅️</button>
        <button class="control-btn" id="downBtn">⬇️</button>
        <button class="control-btn" id="rightBtn">➡️</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let player = { x: 170, y: 170, size: 28, speed: 4.5, color: "#2ed573" };
        let zombies = [];
        let bullets = [];
        let score = 0;
        let highScore = localStorage.getItem("zombieHighScore") || 0;
        let wave = 1;
        let gameOver = false;
        let keys = {};

        function spawnZombiesForWave() {
            zombies = [];
            let count = 3 + wave * 2;
            for (let i = 0; i < count; i++) {
                let side = Math.floor(Math.random() * 4);
                let x, y;
                if (side === 0) { x = Math.random() * canvas.width; y = -40; }
                else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 40; }
                else if (side === 2) { x = -40; y = Math.random() * canvas.height; }
                else { x = canvas.width + 40; y = Math.random() * canvas.height; }
                
                zombies.push({
                    x: x, y: y,
                    size: 26,
                    speed: 1.5 + (wave * 0.2),
                    color: wave % 2 === 0 ? "#ff4757" : "#ffa502"
                });
            }
        }

        function resetGame() {
            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
            score = 0;
            wave = 1;
            gameOver = false;
            spawnZombiesForWave();
        }

        resetGame();

        // کنترل کیبورد
        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            if (gameOver && (e.key === 'r' || e.key === 'R')) resetGame();
        });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        // کنترل‌های لمسی دکمه‌ها
        function setupTouchButton(id, keyName) {
            const btn = document.getElementById(id);
            const activate = (e) => { e.preventDefault(); keys[keyName] = true; };
            const deactivate = (e) => { e.preventDefault(); keys[keyName] = false; };
            
            btn.addEventListener("touchstart", activate);
            btn.addEventListener("touchend", deactivate);
            btn.addEventListener("mousedown", activate);
            btn.addEventListener("mouseup", deactivate);
        }

        setupTouchButton("leftBtn", "ArrowLeft");
        setupTouchButton("rightBtn", "ArrowRight");
        setupTouchButton("upBtn", "ArrowUp");
        setupTouchButton("downBtn", "ArrowDown");

        // شلیک با لمس صفحه
        canvas.addEventListener("click", (e) => {
            if (gameOver) {
                resetGame();
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let pCenterX = player.x + player.size / 2;
            let pCenterY = player.y + player.size / 2;

            let angle = Math.atan2(clickY - pCenterY, clickX - pCenterX);
            let speed = 8;
            bullets.push({
                x: pCenterX,
                y: pCenterY,
                dx: Math.cos(angle) * speed,
                dy: Math.sin(angle) * speed,
                size: 6
            });
        });

        function update() {
            if (gameOver) return;

            // حرکت بازیکن
            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.size) player.x += player.speed;
            if ((keys["ArrowUp"] || keys["w"]) && player.y > 0) player.y -= player.speed;
            if ((keys["ArrowDown"] || keys["s"]) && player.y < canvas.height - player.size) player.y += player.speed;

            // حرکت زامبی‌ها
            for (let zombie of zombies) {
                let dx = player.x - zombie.x;
                let dy = player.y - zombie.y;
                let dist = Math.hypot(dx, dy);
                if (dist > 0) {
                    zombie.x += (dx / dist) * zombie.speed;
                    zombie.y += (dy / dist) * zombie.speed;
                }

                // باختن
                if (
                    player.x < zombie.x + zombie.size &&
                    player.x + player.size > zombie.x &&
                    player.y < zombie.y + zombie.size &&
                    player.y + player.size > zombie.y
                ) {
                    gameOver = true;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("zombieHighScore", highScore);
                    }
                }
            }

            // مدیریت تیرها
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = zombies.length - 1; j >= 0; j--) {
                    let z = zombies[j];
                    if (
                        b.x > z.x && b.x < z.x + z.size &&
                        b.y > z.y && b.y < z.y + z.size
                    ) {
                        bullets.splice(i, 1);
                        zombies.splice(j, 1);
                        score += 10;
                        break;
                    }
                }
            }

            // چک کردن رفتن به موج بعدی
            if (zombies.length === 0) {
                wave++;
                spawnZombiesForWave();
            }
        }

        function draw() {
            ctx.fillStyle = "#181818";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم زامبی‌ها
            for (let z of zombies) {
                ctx.fillStyle = z.color;
                ctx.beginPath();
                ctx.roundRect(z.x, z.y, z.size, z.size, 6);
                ctx.fill();
            }

            // رسم بازیکن
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.size, player.size, 6);
            ctx.fill();

            // رسم تیرها
            ctx.fillStyle = "#ffeaa7";
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // رابط کاربری بالا صفحه داخل بوم
            ctx.fillStyle = "white";
            ctx.font = "bold 14px Tahoma";
            ctx.fillText("امتیاز: " + score, 15, 25);
            ctx.fillText("موج: " + wave, canvas.width - 60, 25);

            // صفحه گیم اور
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff4757";
                ctx.font = "bold 28px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("بازی تمام شد!", canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "#ffffff";
                ctx.font = "16px Tahoma";
                ctx.fillText("امتیاز نهایی: " + score, canvas.width / 2, canvas.height / 2 + 5);
                ctx.fillText("رکورد شما: " + highScore, canvas.width / 2, canvas.height / 2 + 35);
                
                ctx.fillStyle = "#2ed573";
                ctx.font = "14px Tahoma";
                ctx.fillText("برای شروع مجدد ضربه بزنید", canvas.width / 2, canvas.height / 2 + 75);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
